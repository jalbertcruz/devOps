# https://www.docker.com/blog/how-to-use-the-postgres-docker-official-image/
# https://doc.traefik.io/traefik/reference/dynamic-configuration/docker/
# https://dev.to/whchi/setting-up-tls-connection-for-containerized-postgresql-database-1kmh
# https://doc.traefik.io/traefik/routing/services/#tlsservername
# https://doc.traefik.io/traefik/routing/routers/#hostsni-and-hostsniregexp
services:
  postgres1:
    image: postgres:17.5-alpine3.22
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: dpass
      POSTGRES_USER: duser
      POSTGRES_DB: service
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - traefik

  postgres2:
    image: postgres:17.5-alpine3.22
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: dpass
      POSTGRES_USER: duser
      POSTGRES_DB: service
    volumes:
      - pgdata2:/var/lib/postgresql/data
    networks:
      - traefik

  docker-registry:
    image: registry:3.0.0
    restart: always
    ports:
      - "5001:5000"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - traefik
#    labels:
#      - traefik.enable=true
#      - traefik.tcp.routers.docker-registry.entrypoints=docker-registry
#      - traefik.tcp.routers.docker-registry.rule=HostSNI(`docker-registry.personal.test`)
#      - traefik.tcp.routers.docker-registry.tls.certresolver=myresolver
#      - traefik.tcp.services.docker-registry.loadbalancer.server.port=5000

volumes:
  pgdata:
  pgdata2:
  registry-data:
    name: registry-data
    external: true

networks:
  traefik:
