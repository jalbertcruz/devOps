[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{ name }}"
dynamic = ["version"]
description = ''
readme = "README.txt"
requires-python = ">=3.13"
license = "MIT"
keywords = []
authors = [
    { name = "José Albert Cruz Almaguer", email = "jalbertcruz@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    {% for d in dependencies %}
    "{{ d.name }}~={{ d.version }}",
    {% endfor %}
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.6.10",
    "pytest>=8.3.4",
]

[project.urls]
source = "https://github.com/jdev-ops/{{ name }}"

[project.scripts]

[tool.hatch.version]
path = "src/{{ name }}/__about__.py"

[tool.hatch.envs.default]
dependencies = [
    "coverage[toml]",
    "pytest",
]

[[tool.hatch.envs.all.matrix]]
python = ["3.13"]

[tool.hatch.envs.types]
dependencies = [
    "mypy>=1.0.0",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "bin/*",
]
include = [
    "src/",
]
#core-metadata-version = "2.2"

[tool.hatch.build.targets.wheel]
packages = [
    "src/{{ name }}",
]
