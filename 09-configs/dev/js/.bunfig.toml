[install]
registry = "http://localhost:4873"
# Only install package versions published at least 3 days ag
minimumReleaseAge = 259200
# where `bun install --global` installs packages
# BUN_INSTALL_GLOBAL_DIR
#globalDir = "~/.bun/install/global"
# where globally-installed package bins are linked
# BUN_INSTALL_BIN
#globalBinDir = "~/.bun/bin"
#linker = "hoisted"
linker = "isolated"

[install.cache]
# the directory to use for the cache
# XDG_CACHE_HOME
# https://github.com/oven-sh/bun/blob/main/src/env_var.zig#L135C11

#dir = "/home/z/.bun/install/cache"
# when true, don't load from the global cache.
# Bun may still write to node_modules/.cache
disable = false
# when true, always resolve the latest versions from the registry
disableManifest = false

[debug]
# When navigating to a blob: or src: link, open the file in your editor
# If not, it tries $EDITOR or $VISUAL
# If that still fails, it will try Visual Studio Code, then Sublime Text, then a few others
# This is used by Bun.openInEditor()
editor = "neovim"
