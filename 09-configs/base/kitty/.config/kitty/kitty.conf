font_family        JetBrainsMono Nerd Font
font_size 15.0

# how to stop confirm close kitty when closing with fish-shell
confirm_os_window_close 0
#shell_integration no-shell
scrollback_pager_history_size 100
disable_ligatures cursor
cursor_stop_blinking_after 10.0
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 10
enabled_layouts splits:split_axis=horizontal
scrollback_lines 2000
#map f8 launch --stdin-source=@screen_scrollback --type clipboard
#map f7 launch --stdin-source=@screen_scrollback cb
#map f8 launch --stdin-source=@screen_scrollback --stdin-add-formatting less +G -R
#map f1 launch --stdin-source=@screen_scrollback cb add999
#map f1 launch --stdin-source=@screen_scrollback --type clipboard
map f1 launch --stdin-source=@screen_scrollback --type=overlay /usr/local/bin/appslnx/tools/nvim/bin/nvim   

map f8 save_as_session --use-foreground-process --relocatable

# Press F7 and then c to jump to the "cool" project
map f2>o goto_session ~/.config/kitty/sessions/offline-dev.kitty-session
map f2>a goto_session ~/.config/kitty/sessions/akka.kitty-session
# Press F7 and then h to jump to the "hot" project
map f2>c goto_session ~/.config/kitty/sessions/current.kitty-session
# Browse and select from the list of known projects defined via goto_session commands
map f2>/ goto_session
# Same as above, but the sessions are listed alphabetically instead of by most recent
#map f7>/ goto_session --sort-by=alphabetical

# Go to the previously active session (larger negative numbers jump further back in history)
map f7>- goto_session -1

map f9 show_kitty_env_vars

allow_remote_control yes
listen_on unix:@mykitty
allow_hyperlinks yes
shell_integration enabled
kitty_mod ctrl+shift
#map ctrl+shift+1 goto_tab 1
#map ctrl+shift+2 goto_tab 2
#map ctrl+shift+3 goto_tab 3
#map ctrl+shift+4 goto_tab 4
#map ctrl+shift+5 goto_tab 5
#map f5 launch --location=hsplit

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side
#map f6 launch --location=vsplit

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side if the existing window is wide or
# one above the other if the existing window is tall.
#map f4 launch --location=split

# Rotate the current split, changing its split axis from vertical to
# horizontal or vice versa
#map f7 layout_action rotate

# Move the active window in the indicated direction
map shift+up move_window up
map shift+left move_window left
map shift+right move_window right
map shift+down move_window down

# Move the active window to the indicated screen edge
map ctrl+shift+up layout_action move_to_screen_edge top
map ctrl+shift+left layout_action move_to_screen_edge left
map ctrl+shift+right layout_action move_to_screen_edge right
map ctrl+shift+down layout_action move_to_screen_edge bottom

# Switch focus to the neighboring window in the indicated direction
map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

# Set the bias of the split containing the currently focused window. The
# currently focused window will take up the specified percent of its parent
# window's size.
map ctrl+. layout_action bias 80

# Increase font size
# map ctrl+shift+equal change_font_size all +2.0
# map ctrl+shift+plus change_font_size all +2.0
# map ctrl+shift+kp_add change_font_size all +2.0
# map cmd+plus change_font_size all +2.0 🍎
# map cmd+equal change_font_size all +2.0 🍎
# map shift+cmd+equal change_font_size all +2.0 🍎
#
# # Decrease font size
# map ctrl+shift+minus change_font_size all -2.0
# map ctrl+shift+kp_subtract change_font_size all -2.0
# map cmd+minus change_font_size all -2.0 🍎
# map shift+cmd+minus change_font_size all -2.0 🍎
#
# # Reset font size
# map ctrl+shift+backspace change_font_size all 0
# map cmd+0 change_font_size all 0 🍎
