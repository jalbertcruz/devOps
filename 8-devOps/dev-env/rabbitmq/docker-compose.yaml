services:
  rabbit1:
    image: "rabbitmq:4.1.3-management-alpine"
    hostname: "rabbit1"
    networks:
      - dev-network
    volumes:
      - ./definitions.json:/etc/rabbitmq/definitions.json
      - ./rabbitmq.config:/etc/rabbitmq/rabbitmq.conf
      - rabbitmq1-data:/var/lib/rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    labels:
      NAME: "rabbitmq1"

volumes:
  rabbitmq1-data:
    name: ${RABBITMQ_SERVICE_1_VOLUME}
    external: true
  rabbitmq2-data:
    name: ${RABBITMQ_SERVICE_2_VOLUME}
    external: true

networks:
  dev-network:
    name: dev-network
    external: true
