services:
  postgres1:
    image: postgres:17.6-alpine3.22
    profiles: [ tier-1 ]
    container_name: postgres-1
    command: ["postgres", "-c", "log_statement=all", "-c", "log_destination=stderr"]
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: dpass
#      POSTGRES_USER: duser
#      POSTGRES_DB: service
    volumes:
      - postgres-1-data:/var/lib/postgresql/data
      - ./dump:/dump
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - dev-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dev-network
      - traefik.tcp.routers.tcprouter-postgres-1.entryPoints=postgres
      - traefik.tcp.routers.tcprouter-postgres-1.rule=HostSNIRegexp(`postgres-1.personal.local`)
      - traefik.tcp.routers.tcprouter-postgres-1.service=postgres-1
      - traefik.tcp.routers.tcprouter-postgres-1.tls=true
      - traefik.tcp.services.postgres-1.loadbalancer.server.port=5432
      - type=postgres

  postgres2:
    image: postgres:17.5-alpine3.22
    profiles: [ tier-2 ]
    container_name: postgres-2
    restart: always
    ports:
      - 65432:5432
    environment:
      POSTGRES_PASSWORD: dpass
      POSTGRES_USER: duser
      POSTGRES_DB: service
    volumes:
      - postgres-2-data:/var/lib/postgresql/data
      - ./dump:/dump
    networks:
      - dev-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dev-network
      - traefik.tcp.routers.tcprouter-postgres-2.entryPoints=postgres
      - traefik.tcp.routers.tcprouter-postgres-2.rule=HostSNI(`postgres-2.personal.local`)
      - traefik.tcp.routers.tcprouter-postgres-2.service=postgres-2
      - traefik.tcp.routers.tcprouter-postgres-2.tls=true
      - traefik.tcp.services.postgres-2.loadbalancer.server.port=5432
      - type=postgres

volumes:
  postgres-1-data:
    name: ${POSTGRES_SERVICE_1_VOLUME}
    external: true
  postgres-2-data:
    name: ${POSTGRES_SERVICE_2_VOLUME}
    external: true

networks:
  dev-network:
    name: dev-network
    external: true
